#
# Release to PyPI with trusted publishing (docs/development.md, "Releasing").
# Pushing a tag vX.Y.Z on main, where X.Y.Z is metal-pjrt-plugin's version,
# builds and tests the wheels and publishes them once the `pypi`
# environment's reviewer approves. metal-pjrt-core is built and published
# only when its version isn't on PyPI yet; otherwise the frontend is tested
# against the published core it pins. Run by hand (workflow_dispatch) for a
# dry run: everything but the publish job.
#
# No GPU here (GitHub's macOS runners have none usable): before approving,
# download the run's wheels and run the GPU suite on them locally, checking
# their SHA-256 against the test job's (the publish job prints them again
# as the record of what was uploaded).
#
# Third-party actions are pinned by commit (the publish job holds the
# upload token).
#
# COST GUARD: as in ci.yml, every job runs only on a public repository.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODE_VERSION: "26.5"           # as in ci.yml
  CACHE_DIR: ~/.cache/metal-pjrt-plugin
  CACHE_PREFIX_BASE: bazel-macos26-xcode26.5

jobs:
  plan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      plugin_version: ${{ steps.plan.outputs.plugin_version }}
      core_version: ${{ steps.plan.outputs.core_version }}
      build_core: ${{ steps.plan.outputs.build_core }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0              # tags and main, for the checks below
      - name: Versions
        id: plan
        env:
          REF: ${{ github.ref }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import os, re, subprocess, sys, tomllib, urllib.error, urllib.request

          # The library's inputs: a change here needs a new metal-pjrt-core.
          CORE_SOURCES = ["metal_pjrt", "core", "third_party", "MODULE.bazel",
                          "MODULE.bazel.lock", ".bazelrc", ".bazelversion"]

          def on_pypi(name, version):
              url = f"https://pypi.org/pypi/{name}/{version}/json"
              try:
                  urllib.request.urlopen(url, timeout=30)
                  return True
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return False
                  raise

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True)

          def fail(msg):
              print(f"::error::{msg}", file=sys.stderr)
              sys.exit(1)

          plugin = tomllib.load(open("pyproject.toml", "rb"))["project"]
          core = tomllib.load(open("core/pyproject.toml", "rb"))["project"]
          pv, cv = plugin["version"], core["version"]
          pins = [d for d in plugin["dependencies"]
                  if re.match(r"metal-pjrt-core\b", d)]
          if not pins or not pins[0].startswith(f"metal-pjrt-core=={cv};"):
              fail(f"pyproject.toml must pin metal-pjrt-core=={cv}: {pins}")

          ref = os.environ["REF"]
          tagged = ref.startswith("refs/tags/")
          if tagged:
              if ref != f"refs/tags/v{pv}":
                  fail(f"tag {ref} does not match metal-pjrt-plugin {pv}")
              if git("merge-base", "--is-ancestor", "HEAD", "origin/main").returncode:
                  fail(f"{ref} is not on main: tag a commit of main")
          if on_pypi("metal-pjrt-plugin", pv):
              msg = f"metal-pjrt-plugin {pv} is already on PyPI: bump the version"
              if tagged:
                  fail(msg)
              print(f"::notice::{msg} (dry run continues)", file=sys.stderr)

          build_core = not on_pypi("metal-pjrt-core", cv)
          if not build_core:
              # The published core must still be what the sources build: find
              # the first release tag with this core version.
              tags = git("tag", "--list", "v*", "--sort=creatordate").stdout.split()
              released = next(
                  (t for t in tags
                   if re.search(rf'^version = "{re.escape(cv)}"$',
                                git("show", f"{t}:core/pyproject.toml").stdout, re.M)),
                  None)
              if released is None:
                  fail(f"metal-pjrt-core {cv} is on PyPI but no v* tag has it")
              if git("diff", "--quiet", released, "HEAD", "--", *CORE_SOURCES).returncode:
                  fail(f"the library's sources changed since metal-pjrt-core {cv} "
                       f"was released ({released}): bump core/pyproject.toml "
                       f"and the frontend's pin")
          print(f"plugin_version={pv}")
          print(f"core_version={cv}")
          print(f"build_core={str(build_core).lower()}")
          print(f"metal-pjrt-plugin {pv}; metal-pjrt-core {cv} "
                f"({'new: build it' if build_core else 'on PyPI: reuse it'})",
                file=sys.stderr)
          EOF

  frontend:
    if: ${{ !github.event.repository.private }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - name: Build metal-pjrt-plugin
        run: scripts/build_wheel.sh --frontend-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wheel-plugin
          path: dist/metal_pjrt_plugin-*.whl
          if-no-files-found: error

  core:
    # Only when metal-pjrt-core's version is new (build_core); otherwise the
    # steps are skipped and the job succeeds. Skipping the job instead would
    # make `test`, which needs it, skip too.
    if: ${{ !github.event.repository.private }}
    needs: plan
    runs-on: macos-26
    timeout-minutes: 350
    env:
      BUILD: ${{ needs.plan.outputs.build_core }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: ${{ env.BUILD == 'true' }}

      - name: Free disk space
        if: ${{ env.BUILD == 'true' }}
        run: |
          for app in /Applications/Xcode_*.app; do
            [ "$app" = "/Applications/Xcode_${XCODE_VERSION}.app" ] || sudo rm -rf "$app"
          done
          xcrun simctl delete all 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator /Library/Developer/CoreSimulator/Volumes \
            /Library/Developer/CoreSimulator/Images 2>/dev/null || true
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" "${ANDROID_SDK_ROOT:-/nonexistent}" \
            ~/Library/Android /usr/local/share/dotnet ~/.dotnet /usr/local/lib/android 2>/dev/null || true
          df -h /

      - name: Select Xcode
        if: ${{ env.BUILD == 'true' }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Cache key
        id: key
        if: ${{ env.BUILD == 'true' }}
        run: |
          echo "prefix=${CACHE_PREFIX_BASE}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'third_party/PINS.md', '.bazelrc') }}" >> "$GITHUB_OUTPUT"

      # Restore only: ci.yml on main owns the cache (a tag can read main's
      # entries), so a release never evicts it.
      - name: Restore Bazel caches
        if: ${{ env.BUILD == 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ${{ env.CACHE_DIR }}/bazel-disk
            ${{ env.CACHE_DIR }}/bazel-repo
          key: ${{ steps.key.outputs.prefix }}-release
          restore-keys: |
            ${{ steps.key.outputs.prefix }}-
            ${{ env.CACHE_PREFIX_BASE }}-

      - name: Build the dylib
        if: ${{ env.BUILD == 'true' }}
        timeout-minutes: 300
        run: bazel build --config=ci //metal_pjrt/pjrt:pjrt_c_api_mtl_plugin.dylib

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        if: ${{ env.BUILD == 'true' }}

      - name: Build metal-pjrt-core
        if: ${{ env.BUILD == 'true' }}
        run: |
          scripts/build_wheel.sh --no-build
          rm dist/metal_pjrt_plugin-*.whl      # the frontend job's is the one published

      - name: Stop Bazel
        if: ${{ always() && env.BUILD == 'true' }}
        run: bazel shutdown || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ env.BUILD == 'true' }}
        with:
          name: wheel-core
          path: dist/metal_pjrt_core-*.whl
          if-no-files-found: error

  test:
    # The wheels as users get them: installed (not editable) in a fresh venv,
    # with the new core or the published one the frontend pins.
    if: ${{ !github.event.repository.private }}
    needs: [plan, frontend, core]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install the wheels
        run: |
          shasum -a 256 dist/*.whl
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" --find-links dist \
            "metal-pjrt-plugin[test]==${{ needs.plan.outputs.plugin_version }}"
          uv pip list --python "$RUNNER_TEMP/venv/bin/python" | grep -i -E 'metal|jax'
      - name: Python tests (host only)
        # From outside the checkout, so that metal_pjrt_plugin is the
        # installed wheel, not the source tree.
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import metal_pjrt_core, metal_pjrt_plugin
          for m in (metal_pjrt_core, metal_pjrt_plugin):
              assert "site-packages" in m.__file__, m.__file__
              print(m.__name__, m.__file__)
          EOF
          "$RUNNER_TEMP/venv/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" -m "not metal"

  publish:
    # Tags only; the `pypi` environment (tags v*, a required reviewer) and
    # PyPI's trusted publisher (this workflow and environment) gate it too.
    if: ${{ !github.event.repository.private && startsWith(github.ref, 'refs/tags/v') }}
    needs: [plan, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/metal-pjrt-plugin/
    permissions:
      id-token: write                # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: wheel-*
          path: dist
      - name: Wheels only, never an sdist
        run: |
          find dist -type f -exec shasum -a 256 {} +
          for f in dist/*/*; do
            [[ "$f" == *.whl ]] || { echo "::error::only wheels are published: $f"; exit 1; }
          done
      # Core first: the other order could leave a frontend pinned to a core
      # that isn't there. If the frontend's upload fails, "Re-run failed
      # jobs" reruns this job with the first attempt's plan (build_core still
      # true), so core's step skips the file it already uploaded; the
      # frontend's step stays strict.
      - name: Publish metal-pjrt-core
        if: ${{ needs.plan.outputs.build_core == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/wheel-core/
          skip-existing: true
      - name: Publish metal-pjrt-plugin
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/wheel-plugin/
