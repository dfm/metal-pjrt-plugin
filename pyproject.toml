[project]
name = "jax-graft"
version = "0.0.3"
description = "A JAX PJRT plugin for Apple GPUs via Metal (JAX platform \"mtl\")"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "The jax-graft Authors"}]
# PEP 639 (setuptools >= 77): both files land in the wheel's
# dist-info/licenses/.
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
# jax/jaxlib: the lowest version tested, no upper bound (_JAX_MIN in
# jax_graft/__init__.py). metal-pjrt-core: exactly the build this
# release was tested with (core/pyproject.toml), its frontend ABI version
# also checked at startup. tests/test_packaging.py checks both.
dependencies = [
    "jax>=0.10.0",
    "jaxlib>=0.10.0",
    "metal-pjrt-core==0.0.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/dfm/jax-graft"
Issues = "https://github.com/dfm/jax-graft/issues"

[project.optional-dependencies]
test = ["pytest"]
# examples/ (not part of the wheel, which holds only the package).
examples = ["tokenizers", "huggingface_hub", "optax", "pyarrow"]

[project.entry-points.jax_plugins]
mtl = "jax_graft"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Only the Python package: never a "metal_pjrt*" pattern, which would sweep
# the C++ tree metal_pjrt/ in as namespace packages. The library is in
# metal-pjrt-core (core/), so this wheel is pure Python.
[tool.setuptools.packages.find]
include = ["jax_graft*"]
namespaces = false

# tests/: see tests/conftest.py. No pytest-timeout and no xdist: a timeout
# ends the process with GPU work in flight, and parallel workers put several
# GPU jobs on 8 GB. A slow test gets a stack dump (faulthandler) instead.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:timeout -p no:xdist -p no:cacheprovider"
faulthandler_timeout = 240
markers = ["metal: needs the Metal device (run under scripts/device_lock.py)"]
