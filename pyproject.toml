[project]
name = "metal-pjrt-plugin"
version = "0.0.1"
description = "A JAX PJRT plugin for Apple GPUs via Metal (JAX platform \"mtl\")"
readme = "README.md"
requires-python = ">=3.12"
# PEP 639 (setuptools >= 77): both files land in the wheel's
# dist-info/licenses/.
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
dependencies = ["jax==0.11.2", "jaxlib==0.11.2"]

[project.optional-dependencies]
test = ["pytest"]
# examples/ (not part of the wheel, which holds only the package).
examples = ["tokenizers", "huggingface_hub", "optax", "pyarrow"]

[project.entry-points.jax_plugins]
mtl = "metal_pjrt_plugin"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Only the Python package: never a "metal_pjrt*" pattern, which would sweep
# the C++ tree metal_pjrt/ in as namespace packages.
[tool.setuptools.packages.find]
include = ["metal_pjrt_plugin*"]
namespaces = false

# The plugin dylib (scripts/build_wheel.sh copies it in; for editable
# installs it is scripts/install_dev.sh's link into bazel-bin).
[tool.setuptools.package-data]
"metal_pjrt_plugin" = ["*.dylib"]

# tests/: see tests/conftest.py. No pytest-timeout and no xdist: a timeout
# ends the process with GPU work in flight, and parallel workers put several
# GPU jobs on 8 GB. A slow test gets a stack dump (faulthandler) instead.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:timeout -p no:xdist -p no:cacheprovider"
faulthandler_timeout = 240
markers = ["metal: needs the Metal device (run under scripts/device_lock.py)"]
